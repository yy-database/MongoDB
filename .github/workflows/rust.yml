name: Rust

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  primitives:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/mongo.rs
      - name: Format
        run: cargo fmt --manifest-path projects/mongo.rs/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path projects/mongo.rs/Cargo.toml --workspace --all-features -- -D warnings
      - name: Tests
        run: cargo test --manifest-path projects/mongo.rs/Cargo.toml --release --workspace
