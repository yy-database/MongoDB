name: Check Rust

# Rust workspace fmt / clippy / test. TypeScript: check-typescript.yml
# Python: check-python.yml. Publish: publish-npm.yml on v* tags.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-test:
    name: cargo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: projects/mongo.rs
      - name: Format
        run: cargo fmt --manifest-path projects/mongo.rs/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path projects/mongo.rs/Cargo.toml --workspace --all-features -- -D warnings
      - name: Tests
        run: cargo test --manifest-path projects/mongo.rs/Cargo.toml --release --workspace
      - name: Wasm exports
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path projects/mongo.rs/Cargo.toml -p mongo-wasm --target wasm32-unknown-unknown --release
          node scripts/gate-wasm-exports.mjs
