[package]
name = "mongo-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MongoDB protocol and command primitives backed by YYDS .yykv shards"
publish = false

[features]
default = ["storage"]
# The `.yykv` document store and command primitives. Disable it for wasm targets
# that only need the BSON / JSON / wire codecs.
storage = ["dep:yyds"]

[dependencies]
yyds = { workspace = true, optional = true }
serde_json = { workspace = true }
regex = { workspace = true }
