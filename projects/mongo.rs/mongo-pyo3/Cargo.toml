[package]
name = "mongo-pyo3"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Python bindings for the Mongo command primitives"
publish = false

[lib]
name = "mongo_pyo3"
crate-type = ["cdylib", "rlib"]

[dependencies]
mongo = { workspace = true, features = ["storage"] }
database = { git = "https://github.com/yy-database/database.rs.git", rev = "fe9c20ecc9ac27ab8b47475e627487c30b5a9d88", default-features = false, features = ["harness"] }
pyo3 = { workspace = true }
serde_json = "1"
