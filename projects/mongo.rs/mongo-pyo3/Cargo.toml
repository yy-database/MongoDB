[package]
name = "mongo-pyo3"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Python bindings for the Mongo command primitives"
publish = false

[lib]
name = "mongo_pyo3"
crate-type = ["cdylib", "rlib"]

[dependencies]
mongo = { workspace = true, features = ["storage"] }
database = { git = "https://github.com/oovm/boost.rs.git", rev = "70aee1ebc60e0104a88f214ee46af37477b402a7", default-features = false, features = ["harness"] }
pyo3 = { workspace = true }
serde_json = "1"
