[package]
name = "mongo-pyo3"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Python bindings for the Mongo command primitives"
publish = false

[lib]
name = "mongo_pyo3"
crate-type = ["cdylib", "rlib"]

[dependencies]
mongo = { workspace = true, features = ["storage"] }
database = { git = "https://github.com/oovm/boost.rs.git", rev = "ee57adaa0ce12039ad22a80cfee2f4b6cd504ead", default-features = false, features = ["harness"] }
pyo3 = { workspace = true }
serde_json = "1"
