[package]
name = "mongo-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Node bindings for the Mongo command primitives"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mongo = { workspace = true, features = ["storage"] }
database = { git = "https://github.com/oovm/boost.rs.git", rev = "59f0667fbffa421db601f50cfa2d646c4d8e3dba", default-features = false, features = ["harness"] }
database-client = { git = "https://github.com/oovm/boost.rs.git", rev = "59f0667fbffa421db601f50cfa2d646c4d8e3dba" }
data-compression = { git = "https://github.com/oovm/boost.rs.git", rev = "59f0667fbffa421db601f50cfa2d646c4d8e3dba" }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = "1"

[build-dependencies]
napi-build = { workspace = true }
