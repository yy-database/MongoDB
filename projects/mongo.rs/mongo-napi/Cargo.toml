[package]
name = "mongo-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Node bindings for the Mongo command primitives"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mongo = { workspace = true, features = ["storage"] }
database = { git = "https://github.com/oovm/boost.rs.git", rev = "e1447dbc111b4aa8c50af8efa2d44cab3fee65cf", default-features = false, features = ["harness"] }
database-client = { git = "https://github.com/oovm/boost.rs.git", rev = "e1447dbc111b4aa8c50af8efa2d44cab3fee65cf" }
data-compression = { git = "https://github.com/oovm/boost.rs.git", rev = "e1447dbc111b4aa8c50af8efa2d44cab3fee65cf" }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = "1"

[build-dependencies]
napi-build = { workspace = true }
