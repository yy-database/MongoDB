[package]
name = "mongo-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Node bindings for the Mongo command primitives"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mongo = { workspace = true, features = ["storage"] }
database = { git = "https://github.com/oovm/boost.rs.git", rev = "70aee1ebc60e0104a88f214ee46af37477b402a7", default-features = false, features = ["harness"] }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = "1"

[build-dependencies]
napi-build = { workspace = true }
