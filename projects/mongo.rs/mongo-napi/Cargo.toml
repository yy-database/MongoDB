[package]
name = "mongo-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Node bindings for the Mongo command primitives"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mongo = { workspace = true, features = ["storage"] }
database = { git = "https://github.com/yy-database/database.rs.git", rev = "fe9c20ecc9ac27ab8b47475e627487c30b5a9d88", default-features = false, features = ["harness"] }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = "1"

[build-dependencies]
napi-build = { workspace = true }
