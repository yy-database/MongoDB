[package]
name = "mongo-napi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Node bindings for the Mongo command primitives"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mongo = { workspace = true, features = ["storage"] }
database = { git = "https://github.com/oovm/boost.rs.git", rev = "ee57adaa0ce12039ad22a80cfee2f4b6cd504ead", default-features = false, features = ["harness"] }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = "1"

[build-dependencies]
napi-build = { workspace = true }
