[workspace]
resolver = "2"
members = [
    "mongo-core",
    "mongo-napi",
    "mongo-pyo3",
    "mongo-wasm",
]
default-members = ["mongo-core"]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"
repository = "https://github.com/yy-database/MongoDB"

[workspace.dependencies]
# database.rs dependencies: the `database` facade (.yykv shard storage) and the
# shared `database-protocol-mongo` BSON / wire codec.
# Pin full 40-char revs. Local path overrides belong in `.cargo/config.toml`.
# Both pins must name the same `database.rs` `dev` rev: a split pin compiles
# `database-types` twice from two sources and lets one dependency drift.
database = { git = "https://github.com/yy-database/database.rs.git", rev = "b80ed2156e26695ec3e08c2336f820a123e09d85", default-features = false }
# BSON / OP_MSG codec lives upstream in the shared protocol crate.
database-protocol-mongo = { git = "https://github.com/yy-database/database.rs.git", rev = "b80ed2156e26695ec3e08c2336f820a123e09d85" }
# `preserve_order` keeps command documents in the order the caller sent them.
# MongoDB compares embedded documents and `$addToSet` values by field order, so
# sorting keys at parse time would silently merge distinct documents.
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"

napi = { version = "3.14.2", default-features = false, features = ["napi4"] }
napi-derive = "3.6.12"
napi-build = "2.6"
pyo3 = "0.30.1"
wasm-bindgen = "0.2"

[profile.release]
lto = true
