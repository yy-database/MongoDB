[workspace]
resolver = "2"
members = [
    "mongo-napi",
    "mongo-pyo3",
    "mongo-wasm",
]
default-members = ["mongo-napi", "mongo-pyo3", "mongo-wasm"]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Yggdrasill Team <192607617@qq.com>"]
license = "MPL-2.0"
repository = "https://github.com/yy-database/MongoDB"

[workspace.dependencies]
# The `mongo` facade owns BSON / wire codecs, the document store, cursors, oplog
# and command semantics. Bindings below keep only type conversion and error
# mapping. Pin the full 40-char rev and keep it on the `dev` line.
# Local path overrides belong in `.cargo/config.toml`.
mongo = { git = "https://github.com/yy-database/database.rs.git", rev = "6913c5e485950616bfb45fa48fcaf2870bb7537d", default-features = false }

napi = { version = "3.14.2", default-features = false, features = ["napi4"] }
napi-derive = "3.6.12"
napi-build = "2.6"
pyo3 = "0.30.1"
wasm-bindgen = "0.2"

[profile.release]
lto = true
