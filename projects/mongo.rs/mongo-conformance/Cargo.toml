[package]
name = "mongo-conformance"
description = "MongoDB detailed correctness matrix migrated from the upstream facade and gateway tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
mongo = { workspace = true, features = ["storage"] }
database-cluster = { git = "https://github.com/oovm/boost.rs.git", rev = "59f0667fbffa421db601f50cfa2d646c4d8e3dba" }
database-execution = { git = "https://github.com/oovm/boost.rs.git", rev = "59f0667fbffa421db601f50cfa2d646c4d8e3dba" }
database-protocol-mongo = { git = "https://github.com/oovm/boost.rs.git", rev = "59f0667fbffa421db601f50cfa2d646c4d8e3dba" }
database-server = { git = "https://github.com/oovm/boost.rs.git", rev = "59f0667fbffa421db601f50cfa2d646c4d8e3dba" }
database-storage = { git = "https://github.com/oovm/boost.rs.git", rev = "59f0667fbffa421db601f50cfa2d646c4d8e3dba" }
database-types = { git = "https://github.com/oovm/boost.rs.git", rev = "59f0667fbffa421db601f50cfa2d646c4d8e3dba" }
serde_json = "1"
